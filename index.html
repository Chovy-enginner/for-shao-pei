<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給韶霈 💕</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffd6e7,#fff0f5);
  font-family:"Microsoft JhengHei",sans-serif;
  padding:20px 0;
  box-sizing:border-box;
}
.card{
  background:white;
  width:350px;
  padding:30px 40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}
.nav{
  display:flex;
  justify-content:space-around;
  margin-bottom:20px;
  border-bottom:2px solid #ffe3ec;
  padding-bottom:10px;
}
.nav a{
  text-decoration:none;
  color:#888;
  font-size:14px;
  font-weight:bold;
}
.nav a.active{
  color:#ff4f87;
  border-bottom:2px solid #ff4f87;
  padding-bottom:2px;
}
.heart{
  font-size:60px;
  animation:beat 1s infinite;
}
@keyframes beat{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}
h1{
  color:#ff4f87;
  margin-bottom:15px;
}
p{
  color:#666;
  line-height:1.8;
}
.btn{
  display:inline-block;
  background:#ff6b9e;
  color:white;
  text-decoration:none;
  padding:12px 24px;
  border-radius:30px;
  font-size:16px;
  margin-top:20px;
  transition:0.3s;
}
.btn:hover{
  background:#ff4f87;
}
</style>
</head>
<body>
<div class="card">
  <!-- 頂部導覽選單 -->
  <div class="nav">
    <a href="index.html" class="active">首頁</a>
    <a href="page2.html">悄悄話</a>
    <a href="page3.html">回憶牆</a>
    <a href="page4.html">願望清單</a>
  </div>

  <div class="heart">💗</div>
  <h1>給韶霈</h1>
  <p>
  如果你看到這個頁面，<br>
  表示妳已經開始想我了 🥳
  </p>
  <a href="page2.html" class="btn">看第一條悄悄話 ➔</a>
</div>
</body>
</html>
