<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給韶霈 💕</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e7, #fff0f5);
    font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* 飄浮愛心背景 */
  #heart-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .floating-heart {
    position: absolute;
    bottom: -50px;
    color: rgba(255, 130, 168, 0.45);
    user-select: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg) scale(0.8);
      opacity: 0;
    }
    15% { opacity: 0.7; }
    85% { opacity: 0.7; }
    100% {
      transform: translateY(-105vh) rotate(360deg) scale(1.2);
      opacity: 0;
    }
  }

  /* 主卡片容器 */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    width: 100%;
    max-width: 750px;
    min-height: 520px;
    padding: 35px 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(255, 107, 158, 0.25);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* 頂部導覽列 */
  .nav {
    display: flex;
    justify-content: space-around;
    border-bottom: 2px solid #ffe3ec;
    padding-bottom: 12px;
    margin-bottom: 25px;
  }
  .nav button {
    background: none;
    border: none;
    color: #888;
    font-size: 16px;
    font-weight: bold;
    padding: 8px 14px;
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.3s;
  }
  .nav button.active {
    color: #ff4f87;
    background-color: #ffe3ec;
  }

  /* 主愛心圖示 */
  .heart-icon {
    font-size: 60px;
    margin-bottom: 10px;
    animation: beat 1.2s infinite ease-in-out;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  h1, h2 {
    color: #ff4f87;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 15px;
  }
  p {
    color: #555;
    font-size: 19px;
    line-height: 1.7;
    margin-bottom: 25px;
  }

  /* 按鈕 */
  .btn {
    background: linear-gradient(135deg, #ff6b9e, #ff4f87);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 40px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(255, 79, 135, 0.3);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 79, 135, 0.4);
  }

  /* 滑動相簿輪播樣式 */
  .carousel-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 320px;
    margin: 0 auto 20px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  }
  .photo-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
  }
  .photo-slide.active {
    opacity: 1;
  }
  .photo-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background-color: #fff0f5;
  }

  /* 相簿左右切換按鈕 */
  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.85);
    border: none;
    color: #ff4f87;
    font-size: 20px;
    font-weight: bold;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 5;
    transition: 0.2s;
  }
  .carousel-btn:hover {
    background: white;
    transform: translateY(-50%) scale(1.1);
  }
  .carousel-btn.prev { left: 10px; }
  .carousel-btn.next { right: 10px; }

  /* 相簿指示點 */
  .dots-container {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 5;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
  }
  .dot.active {
    background: #ff4f87;
    width: 20px;
    border-radius: 10px;
  }

  /* 分頁切換 */
  .page {
    display: none;
  }
  .page.active {
    display: block;
  }

  .footer-text {
    color: #ffa1c5;
    font-size: 13px;
    margin-top: 15px;
  }
</style>
</head>
<body>

<!-- 滿版飄浮愛心背景 -->
<div id="heart-bg"></div>

<div class="card">
  <!-- 頂部導覽列 -->
  <div class="nav">
    <button id="nav-home" class="active" onclick="showPage('home')">🏠 首頁</button>
    <button id="nav-whisper" onclick="showPage('whisper')">💌 悄悄話</button>
    <button id="nav-memories" onclick="showPage('memories')">📸 回憶牆</button>
    <button id="nav-wishes" onclick="showPage('wishes')">🎁 願望清單</button>
  </div>

  <!-- 內容區域 -->
  <div class="content">
    <!-- 1. 首頁 -->
    <div id="page-home" class="page active">
      <div class="heart-icon">💗</div>
      <h1>給韶霈</h1>
      <p>
        如果你看到這個頁面，<br>
        表示妳已經開始想我了 🥳
      </p>
      <button class="btn" onclick="showPage('whisper')">看第一條悄悄話 ➔</button>
    </div>

    <!-- 2. 悄悄話 -->
    <div id="page-whisper" class="page">
      <div class="heart-icon">💌</div>
      <h1>悄悄話</h1>
      <p>
        其實我也一直在想妳 💕<br>
        無論今天過得怎麼樣，<br>
        記得都有我在這裡陪著妳！
      </p>
      <button class="btn" onclick="showPage('memories')">去看我們的回憶 ➔</button>
    </div>

    <!-- 3. 回憶牆 -->
    <div id="page-memories" class="page">
      <h2>我們的回憶牆 📸</h2>
      
      <!-- 相簿輪播區 -->
      <div class="carousel-container">
        <button class="carousel-btn prev" onclick="changeSlide(-1)">❮</button>
        <button class="carousel-btn next" onclick="changeSlide(1)">❯</button>
        
        <div id="photo-list">
          <div class="photo-slide active"><img src="線條小狗.png" alt="線條小狗"></div>
        </div>

        <div class="dots-container" id="dots-list">
          <span class="dot active" onclick="setSlide(0)"></span>
        </div>
      </div>

      <button class="btn" onclick="showPage('wishes')">前往願望清單 ➔</button>
    </div>

    <!-- 4. 願望清單 -->
    <div id="page-wishes" class="page">
      <div class="heart-icon">🎁</div>
      <h1>願望清單</h1>
      <p>
        想跟妳一起去的每個地方，<br>
        我們一個一個去實現！🎒
      </p>
      <button class="btn" onclick="showPage('home')">⬅ 回到首頁</button>
    </div>
  </div>

  <div class="footer-text">
    Made with ❤️ for Shao Pei
  </div>
</div>

<script>
  // 分頁切換功能
  function showPage(pageName) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) {
      pages[i].classList.remove('active');
    }
    
    var navBtns = document.querySelectorAll('.nav button');
    for (var j = 0; j < navBtns.length; j++) {
      navBtns[j].classList.remove('active');
    }

    var targetPage = document.getElementById('page-' + pageName);
    var targetNav = document.getElementById('nav-' + pageName);
    
    if (targetPage) targetPage.classList.add('active');
    if (targetNav) targetNav.classList.add('active');
  }

  // 自動生成飄浮愛心背景
  function createFloatingHearts() {
    var bg = document.getElementById('heart-bg');
    if (!bg) return;
    var heartSymbols = ['💗', '💖', '💕', '💓', '✨', '🌸'];

    for (var i = 0; i < 22; i++) {
      var heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      
      heart.style.left = Math.random() * 100 + '%';
      heart.style.fontSize = (16 + Math.random() * 24) + 'px';
      heart.style.animationDuration = (6 + Math.random() * 7) + 's';
      heart.style.animationDelay = (Math.random() * 5) + 's';

      bg.appendChild(heart);
    }
  }

  // 相簿切換 JavaScript（傳統穩健寫法）
  var currentSlide = 0;
  function updateSlides() {
    var slides = document.querySelectorAll('.photo-slide');
    var dots = document.querySelectorAll('.dot');
    
    for (var i = 0; i < slides.length; i++) {
      if (i === currentSlide) {
        slides[i].classList.add('active');
      } else {
        slides[i].classList.remove('active');
      }
    }

    for (var j = 0; j < dots.length; j++) {
      if (j === currentSlide) {
        dots[j].classList.add('active');
      } else {
        dots[j].classList.remove('active');
      }
    }
  }

  function changeSlide(direction) {
    var slides = document.querySelectorAll('.photo-slide');
    if (slides.length === 0) return;
    currentSlide = (currentSlide + direction + slides.length) % slides.length;
    updateSlides();
  }

  function setSlide(index) {
    currentSlide = index;
    updateSlides();
  }

  window.onload = function() {
    createFloatingHearts();
  };
</script>

</body>
</html>
