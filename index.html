<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給韶霈 💕</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e7, #fff0f5);
    font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* 飄浮愛心背景 */
  #heart-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .floating-heart {
    position: absolute;
    bottom: -50px;
    color: rgba(255, 130, 168, 0.45);
    user-select: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg) scale(0.8);
      opacity: 0;
    }
    15% { opacity: 0.7; }
    85% { opacity: 0.7; }
    100% {
      transform: translateY(-105vh) rotate(360deg) scale(1.2);
      opacity: 0;
    }
  }

  /* 主卡片容器 */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(10px);
    width: 100%;
    max-width: 780px;
    min-height: 560px;
    padding: 30px 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(255, 107, 158, 0.25);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* 頂部導覽列 */
  .nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 2px solid #ffe3ec;
    padding-bottom: 12px;
    margin-bottom: 20px;
  }
  .nav button {
    background: rgba(255, 227, 236, 0.4);
    border: none;
    color: #777;
    font-size: 15px;
    font-weight: bold;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.3s ease;
  }
  .nav button:hover {
    color: #ff4f87;
    background-color: #ffe3ec;
  }
  .nav button.active {
    color: #fff;
    background: linear-gradient(135deg, #ff6b9e, #ff4f87);
    box-shadow: 0 4px 10px rgba(255, 79, 135, 0.3);
  }

  /* 主愛心圖示 */
  .heart-icon {
    font-size: 55px;
    margin-bottom: 10px;
    display: inline-block;
    animation: beat 1.2s infinite ease-in-out;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  h1, h2 {
    color: #ff4f87;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 12px;
  }
  p {
    color: #555;
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  /* 按鈕 */
  .btn {
    background: linear-gradient(135deg, #ff6b9e, #ff4f87);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 40px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(255, 79, 135, 0.3);
    margin: 10px auto 0;
    display: inline-block;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 79, 135, 0.4);
  }

  /* 影片播放器容器 */
  .video-container {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 0 auto 15px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(255, 107, 158, 0.25);
    background-color: #000;
  }
  .video-container video {
    width: 100%;
    max-height: 380px;
    display: block;
    border-radius: 20px;
    outline: none;
    object-fit: contain;
  }

  /* 分頁切換 */
  .page {
    display: none;
    animation: fadeIn 0.4s ease-in-out;
  }
  .page.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .footer-text {
    color: #ffa1c5;
    font-size: 13px;
    margin-top: 15px;
  }
</style>
</head>
<body>

<!-- 滿版飄浮愛心背景 -->
<div id="heart-bg"></div>

<div class="card">
  <!-- 頂部導覽列 (五個分頁) -->
  <div class="nav">
    <button id="nav-home" class="active" onclick="showPage('home')">🏠 首頁</button>
    <button id="nav-yiyu" onclick="showPage('yiyu')">✨ 一隅</button>
    <button id="nav-fantuan" onclick="showPage('fantuan')">🍙 飯糰</button>
    <button id="nav-baozi" onclick="showPage('baozi')">🥟 包子</button>
    <button id="nav-jimao" onclick="showPage('jimao')">🪶 雞毛</button>
  </div>

  <!-- 內容區域 -->
  <div class="content">
    <!-- 1. 首頁 -->
    <div id="page-home" class="page active">
      <div class="heart-icon">💗</div>
      <h1>給韶霈 💕</h1>
      <p>
        如果你看到這個頁面，<br>
        表示妳已經開始想我了 🥳<br>
        點擊上方分頁看看為妳準備的專屬影片吧！
      </p>
      <button class="btn" onclick="showPage('yiyu')">前往第一頁：一隅 ➔</button>
    </div>

    <!-- 2. 一隅 -->
    <div id="page-yiyu" class="page">
      <h2>✨ 一隅</h2>
      <div class="video-container">
        <video controls playsinline preload="metadata">
          <source src="1.mp4" type="video/mp4">
          您的瀏覽器不支援影片播放。
        </video>
      </div>
      <p>無論在世界的哪個角落，妳永遠是我最安心的一隅 💕</p>
      <button class="btn" onclick="showPage('fantuan')">下一頁：飯糰 ➔</button>
    </div>

    <!-- 3. 飯糰 -->
    <div id="page-fantuan" class="page">
      <h2>🍙 飯糰</h2>
      <div class="video-container">
        <video controls playsinline preload="metadata">
          <source src="2.mp4" type="video/mp4">
          您的瀏覽器不支援影片播放。
        </video>
      </div>
      <p>像飯糰一樣緊緊抱在一起，溫暖又甜蜜 🍣</p>
      <button class="btn" onclick="showPage('baozi')">下一頁：包子 ➔</button>
    </div>

    <!-- 4. 包子 -->
    <div id="page-baozi" class="page">
      <h2>🥟 包子</h2>
      <div class="video-container">
        <video controls playsinline preload="metadata">
          <source src="3.mp4" type="video/mp4">
          您的瀏覽器不支援影片播放。
        </video>
      </div>
      <p>圓圓軟軟的包子，裝滿了我對妳的喜歡 🥟💓</p>
      <button class="btn" onclick="showPage('jimao')">下一頁：雞毛 ➔</button>
    </div>

    <!-- 5. 雞毛 -->
    <div id="page-jimao" class="page">
      <h2>🪶 雞毛</h2>
      <div class="video-container">
        <video controls playsinline preload="metadata">
          <source src="4.mp4" type="video/mp4">
          您的瀏覽器不支援影片播放。
        </video>
      </div>
      <p>即使是生活中雞毛蒜皮的小事，只要有妳都很幸福 🌸</p>
      <button class="btn" onclick="showPage('home')">⬅ 回到首頁</button>
    </div>
  </div>

  <div class="footer-text">
    Made with ❤️ for Shao Pei
  </div>
</div>

<script>
  // 分頁切換功能（切換時會自動暫停其他頁面播放中的影片）
  function showPage(pageName) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) {
      pages[i].classList.remove('active');
    }
    
    var navBtns = document.querySelectorAll('.nav button');
    for (var j = 0; j < navBtns.length; j++) {
      navBtns[j].classList.remove('active');
    }

    // 暫停所有影片
    var videos = document.querySelectorAll('video');
    videos.forEach(function(video) {
      video.pause();
    });

    var targetPage = document.getElementById('page-' + pageName);
    var targetNav = document.getElementById('nav-' + pageName);
    
    if (targetPage) targetPage.classList.add('active');
    if (targetNav) targetNav.classList.add('active');
  }

  // 自動生成飄浮愛心背景
  function createFloatingHearts() {
    var bg = document.getElementById('heart-bg');
    if (!bg) return;
    var heartSymbols = ['💗', '💖', '💕', '💓', '✨', '🌸'];

    for (var i = 0; i < 22; i++) {
      var heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      
      heart.style.left = Math.random() * 100 + '%';
      heart.style.fontSize = (16 + Math.random() * 24) + 'px';
      heart.style.animationDuration = (6 + Math.random() * 7) + 's';
      heart.style.animationDelay = (Math.random() * 5) + 's';

      bg.appendChild(heart);
    }
  }

  window.onload = function() {
    createFloatingHearts();
  };
</script>

</body>
</html>
