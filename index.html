<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給韶霈 💕</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e7, #fff0f5);
    font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* 飄浮愛心背景 */
  #heart-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .floating-heart {
    position: absolute;
    bottom: -50px;
    color: rgba(255, 130, 168, 0.45);
    user-select: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg) scale(0.8);
      opacity: 0;
    }
    15% { opacity: 0.7; }
    85% { opacity: 0.7; }
    100% {
      transform: translateY(-105vh) rotate(360deg) scale(1.2);
      opacity: 0;
    }
  }

  /* 主卡片容器 */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    width: 100%;
    max-width: 750px;
    min-height: 520px;
    padding: 35px 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(255, 107, 158, 0.25);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* 頂部導覽列 */
  .nav {
    display: flex;
    justify-content: space-around;
    border-bottom: 2px solid #ffe3ec;
    padding-bottom: 12px;
    margin-bottom: 25px;
  }
  .nav button {
    background: none;
    border: none;
    color: #888;
    font-size: 16px;
    font-weight: bold;
    padding: 8px 14px;
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.3s;
  }
  .nav button.active {
    color: #ff4f87;
    background-color: #ffe3ec;
  }

  /* 主愛心圖示 */
  .heart-icon {
    font-size: 60px;
    margin-bottom: 10px;
    animation: beat 1.2s infinite ease-in-out;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  h1, h2 {
    color: #ff4f87;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 15px;
  }
  p {
    color: #555;
    font-size: 19px;
    line-height: 1.7;
    margin-bottom: 25px;
  }

  /* 按鈕 */
  .btn {
    background: linear-gradient(135deg, #ff6b9e, #ff4f87);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 40px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(255, 79, 135, 0.3);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 79, 135, 0.4);
  }

  /* 滑動相簿輪播樣式 */
  .carousel-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 320px;
    margin: 0 auto 20px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  }
  .photo-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
  }
  .photo-slide.active {
    opacity: 1;
  }
  .photo-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* 完整呈現可愛圖片不裁切 */
    background-color: #fff0f5;
  }

  /* 相簿左右切換按鈕 */
  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.85);
    border: none;
    color: #ff4f87;
    font-size: 20px;
    font-weight: bold;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 5;
    transition: 0.2s;
  }
  .carousel-btn:hover {
    background: white;
    transform: translateY(-50%) scale(1.1);
  }
  .carousel-btn.prev { left: 10px; }
