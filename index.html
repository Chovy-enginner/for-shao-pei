<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給韶霈 💕</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffd6e7,#fff0f5);
  font-family:"Microsoft JhengHei",sans-serif;
  padding:20px;
  box-sizing:border-box;
}
/* 放大卡片尺寸 */
.card{
  background:white;
  width:100%;
  max-width:700px;
  padding:50px 40px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.12);
  box-sizing:border-box;
}
/* 放大導覽列文字與間距 */
.nav{
  display:flex;
  justify-content:space-around;
  margin-bottom:35px;
  border-bottom:2px solid #ffe3ec;
  padding-bottom:15px;
}
.nav a{
  text-decoration:none;
  color:#888;
  font-size:18px;
  font-weight:bold;
  padding:5px 10px;
}
.nav a.active{
  color:#ff4f87;
  border-bottom:3px solid #ff4f87;
}
.heart{
  font-size:80px;
  animation:beat 1s infinite;
  margin-bottom:15px;
}
@keyframes beat{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}
h1{
  color:#ff4f87;
  font-size:36px;
  margin-bottom:20px;
}
p{
  color:#666;
  font-size:20px;
  line-height:1.9;
  margin-bottom:30px;
}
.btn{
  display:inline-block;
  background:#ff6b9e;
  color:white;
  text-decoration:none;
  padding:16px 36px;
  border-radius:40px;
  font-size:20px;
  font-weight:bold;
  transition:0.3s;
}
.btn:hover{
  background:#ff4f87;
  transform:translateY(-2px);
}
</style>
</head>
<body>
<div class="card">
  <div class="nav">
    <a href="index.html" class="active">首頁</a>
    <a href="page2.html">悄悄話</a>
    <a href="page3.html">回憶牆</a>
    <a href="page4.html">願望清單</a>
  </div>

  <div class="heart">💗</div>
  <h1>給韶霈</h1>
  <p>
  如果你看到這個頁面，<br>
  表示妳已經開始想我了 🥳
  </p>
  <a href="page2.html" class="btn">看第一條悄悄話 ➔</a>
</div>
</body>
</html>
